<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="color-scheme" content="dark">
<title>Attendance</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --bg:#12141c;
    --bg-raised:#1b1f2b;
    --bg-raised-2:#232838;
    --paper:#f3efe4;
    --paper-checked:#ece2c4;
    --paper-edge:#ddd6bf;
    --ink-red:#a6362b;
    --ink-red-dark:#7c2620;
    --brass:#c79a4b;
    --slate:#5b7089;
    --text-light:#ede9df;
    --text-muted:#9da2ae;
    --text-dark:#2a2620;
    --shadow:rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:radial-gradient(circle at 50% 0%, #1a1e2c 0%, var(--bg) 60%);
    color:var(--text-light);
    font-family:'Space Grotesk',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;padding:32px 18px 110px;}

  header.ledger-head{text-align:center;margin-bottom:32px;}
  .title-row h1{font-family:'Special Elite','Courier New',monospace;font-weight:400;font-size:26px;letter-spacing:.5px;margin:0 0 6px;color:var(--text-light);}
  .hint{font-size:12.5px;color:var(--text-muted);margin:0 0 24px;letter-spacing:.3px;}

  .date-block{display:flex;justify-content:center;margin-bottom:12px;}
  .daynum-wrap{display:flex;align-items:center;gap:12px;}
  .daynum{font-family:'Special Elite';font-size:40px;line-height:1;color:var(--brass);border:2px solid var(--brass);outline:1px solid var(--brass);outline-offset:4px;padding:4px 16px;border-radius:2px;}
  .weekday-month{display:flex;flex-direction:column;align-items:flex-start;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:2px;color:var(--slate);text-align:left;}
  .weekday-month .yr{color:var(--text-muted);margin-top:2px;}
  .clock{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-muted);letter-spacing:1.5px;}

  .tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:12px;}

  .tile{position:relative;background:var(--paper);border:1px solid var(--paper-edge);border-radius:4px;min-height:92px;padding:14px 10px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;box-shadow:0 4px 10px var(--shadow);transition:transform .12s ease;-webkit-tap-highlight-color:transparent;}
  .tile:active{transform:scale(.96);}
  .tile.checked:active{transform:none;}
  .tile:focus-visible{outline:2px solid var(--brass);outline-offset:3px;}
  .tile .name{font-weight:600;font-size:15px;color:var(--text-dark);line-height:1.25;overflow-wrap:anywhere;}
  .tile.checked{background:var(--paper-checked);}
  .tile.checked .name{font-size:12px;font-weight:500;opacity:.65;margin-top:36px;}

  .stamp{position:absolute;top:10px;left:50%;transform:translateX(-50%) rotate(-7deg);display:flex;flex-direction:column;align-items:center;border:2px solid var(--ink-red);outline:1px solid var(--ink-red);outline-offset:2px;padding:2px 9px 3px;border-radius:2px;filter:url(#roughen);pointer-events:none;}
  .stamp .stamp-text{font-family:'Special Elite',monospace;font-size:11px;letter-spacing:1px;color:var(--ink-red);line-height:1.3;}
  .stamp .stamp-time{font-family:'IBM Plex Mono',monospace;font-size:8.5px;color:var(--ink-red-dark);letter-spacing:.5px;}

  @keyframes stampIn{0%{transform:translateX(-50%) rotate(-7deg) scale(2.4);opacity:0;}55%{opacity:1;}100%{transform:translateX(-50%) rotate(-7deg) scale(1);opacity:1;}}
  .stamp.animate{animation:stampIn .38s cubic-bezier(.2,1.5,.4,1);}
  @media (prefers-reduced-motion:reduce){.stamp.animate{animation:none;}}

  .empty-state{text-align:center;padding:60px 20px;color:var(--text-muted);}
  .empty-state button{margin-top:14px;}

  .manage-btn{position:fixed;right:16px;bottom:16px;width:46px;height:46px;border-radius:50%;background:var(--bg-raised);border:1px solid #2c3143;color:var(--text-muted);font-size:19px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.6;transition:opacity .15s;}
  .manage-btn:hover,.manage-btn:focus-visible{opacity:1;outline:2px solid var(--brass);}

  .toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(20px);background:var(--bg-raised-2);color:var(--text-light);padding:10px 18px;border-radius:24px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;z-index:80;border:1px solid #333952;max-width:80vw;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  [hidden]{display:none !important;}

  .overlay{position:fixed;inset:0;background:rgba(8,9,14,.6);display:flex;align-items:flex-end;justify-content:center;z-index:90;}
  .panel{background:var(--bg-raised);width:100%;max-width:560px;max-height:85vh;border-radius:18px 18px 0 0;border-top:1px solid #2c3143;display:flex;flex-direction:column;overflow:hidden;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;flex:0 0 auto;border-bottom:1px solid #262b3a;}
  .panel-head h2{font-family:'Special Elite';font-weight:400;font-size:19px;margin:0;}
  .panel-body{overflow-y:auto;padding:20px 20px 30px;flex:1 1 auto;}
  .close-btn{background:none;border:none;color:var(--text-muted);font-size:24px;cursor:pointer;line-height:1;padding:4px 6px;}
  .close-btn:focus-visible{outline:2px solid var(--brass);}

  .tabs{display:flex;gap:8px;margin-bottom:18px;}
  .tab-btn{flex:1;padding:9px;border-radius:8px;border:1px solid #2c3143;background:transparent;color:var(--text-muted);font-family:'Space Grotesk';font-weight:600;font-size:13px;cursor:pointer;}
  .tab-btn.active{background:var(--brass);color:#1a1508;border-color:var(--brass);}

  .field{margin-bottom:18px;}
  .field label{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px;}
  .field input[type=text]{width:100%;background:var(--bg);border:1px solid #2c3143;border-radius:8px;padding:10px 12px;color:var(--text-light);font-family:'Space Grotesk';font-size:14px;}
  .field input[type=text]:focus-visible,.field input[type=text]:focus{outline:2px solid var(--brass);border-color:var(--brass);}

  .add-row{display:flex;gap:8px;}
  .add-row input{flex:1;}
  .btn{background:var(--brass);color:#1a1508;border:none;border-radius:8px;padding:10px 16px;font-weight:700;font-size:13px;cursor:pointer;font-family:'Space Grotesk';}
  .btn:focus-visible{outline:2px solid var(--text-light);}
  .btn.secondary{background:transparent;border:1px solid #2c3143;color:var(--text-light);font-weight:600;}

  .roster-list{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;}
  .roster-list li{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:1px solid #262b3a;border-radius:8px;padding:9px 12px;font-size:14px;}
  .remove-btn{background:none;border:none;color:var(--slate);font-size:16px;cursor:pointer;padding:2px 6px;}
  .remove-btn:hover{color:var(--ink-red);}

  .history-empty{color:var(--text-muted);font-size:13px;padding:20px 0;text-align:center;}
  details.history-date{border:1px solid #262b3a;border-radius:8px;margin-bottom:8px;overflow:hidden;}
  details.history-date summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;}
  details.history-date summary::-webkit-details-marker{display:none;}
  details.history-date summary::marker{display:none;}
  details.history-date summary .count{font-family:'IBM Plex Mono';font-size:11px;color:var(--text-muted);font-weight:400;}
  .history-list{list-style:none;margin:0;padding:0 14px 12px;display:flex;flex-direction:column;gap:5px;}
  .history-list li{display:flex;justify-content:space-between;font-size:13px;color:var(--text-muted);font-family:'IBM Plex Mono';}
  .history-list li span:first-child{color:var(--text-light);font-family:'Space Grotesk';}
  .copy-btn-row{padding:0 14px 12px;}

  .pin-screen{text-align:center;padding:14px 4px 6px;}
  .pin-screen p{margin:0 0 16px;color:var(--text-muted);font-size:13px;}
  .pin-screen input[type=password]{width:150px;text-align:center;letter-spacing:8px;font-size:20px;margin:0 auto 12px;display:block;background:var(--bg);border:1px solid #2c3143;border-radius:8px;padding:10px;color:var(--text-light);font-family:'IBM Plex Mono',monospace;}
  .pin-screen input[type=password]:focus-visible,.pin-screen input[type=password]:focus{outline:2px solid var(--brass);border-color:var(--brass);}
  .pin-error{color:var(--ink-red);font-size:12px;margin:-4px 0 12px;}
  .change-pin-form{margin-top:10px;}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute;overflow:hidden">
  <defs>
    <filter id="roughen" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/>
    </filter>
  </defs>
</svg>

<div class="wrap">
  <header class="ledger-head">
    <div class="title-row"><h1 id="groupTitle">Attendance</h1></div>
    <p class="hint">Tap your name to check in</p>
    <div class="date-block">
      <div class="daynum-wrap">
        <span class="daynum" id="daynum">28</span>
        <span class="weekday-month"><span id="weekday">FRI</span><span class="yr" id="monthyear">AUG 2026</span></span>
      </div>
    </div>
    <div class="clock" id="clock">—:—:—</div>
  </header>

  <div id="emptyState" class="empty-state" hidden>
    <p>No names on the list yet.</p>
    <button class="btn" id="emptyManageBtn">Open Manage</button>
  </div>

  <div id="grid" class="tile-grid"></div>
</div>

<button class="manage-btn" id="manageToggle" aria-label="Manage roster and history">⚙</button>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="overlay" id="overlay" hidden>
  <div class="panel">
    <div class="panel-head">
      <h2>Manage</h2>
      <button class="close-btn" id="closeManage" aria-label="Close">×</button>
    </div>
    <div class="panel-body">
    <div id="pinSetupSection" class="pin-screen" hidden>
      <p>Set a PIN to protect this panel. You'll need it every time you open Manage.</p>
      <input type="password" inputmode="numeric" id="newPin1" placeholder="New PIN" autocomplete="off">
      <input type="password" inputmode="numeric" id="newPin2" placeholder="Confirm PIN" autocomplete="off">
      <p class="pin-error" id="pinSetupError" hidden>PIN must be at least 4 digits and match</p>
      <button class="btn" id="pinSetupBtn">Save PIN</button>
    </div>

    <div id="pinLockSection" class="pin-screen" hidden>
      <p>Enter the Manage PIN</p>
      <input type="password" inputmode="numeric" id="pinInput" placeholder="PIN" autocomplete="off">
      <p class="pin-error" id="pinError" hidden>Incorrect PIN</p>
      <button class="btn" id="pinSubmit">Unlock</button>
    </div>

    <div id="contentSection" hidden>
      <div class="tabs">
        <button class="tab-btn active" id="tabRoster">Names</button>
        <button class="tab-btn" id="tabHistory">History</button>
      </div>

      <div id="rosterTab">
        <div class="field">
          <label for="titleInput">Event name</label>
          <input type="text" id="titleInput" placeholder="Attendance">
        </div>
        <div class="field" style="margin-bottom:8px;">
          <label>Add a name</label>
          <div class="add-row">
            <input type="text" id="nameInput" placeholder="Full name">
            <button class="btn" id="addNameBtn">Add</button>
          </div>
        </div>
        <ul class="roster-list" id="rosterList"></ul>
        <div class="field" style="margin-top:20px;">
          <label>Security</label>
          <button class="btn secondary" id="changePinBtn" type="button">Change PIN</button>
          <div id="changePinForm" class="change-pin-form" hidden>
            <div class="add-row" style="margin-bottom:8px;">
              <input type="password" inputmode="numeric" id="newPinChange" placeholder="New PIN" autocomplete="off">
            </div>
            <div class="add-row">
              <input type="password" inputmode="numeric" id="newPinChangeConfirm" placeholder="Confirm new PIN" autocomplete="off">
              <button class="btn" id="savePinChangeBtn">Save</button>
            </div>
          </div>
        </div>
      </div>

      <div id="historyTab" hidden>
        <div id="historyList"></div>
      </div>
    </div>
    </div>
  </div>
</div>

<script>
(function(){
  const WEEKDAYS = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

  let roster = [];
  let groupTitle = 'Attendance';
  let attendanceToday = {};
  let todayKey = dateKey(new Date());
  let justChecked = null;
  let manageOpen = false;

  const el = (id) => document.getElementById(id);

  function dateKey(d){
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function formatTime(iso){
    try{ return new Date(iso).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}); }
    catch(e){ return ''; }
  }
  function formatDateLabel(dstr){
    const [y,m,d] = dstr.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    return `${WEEKDAYS[dt.getDay()]} ${MONTHS[dt.getMonth()]} ${d}, ${y}`;
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // Browser-safe storage adapter.
  // The original version used `window.storage`, which is not a standard
  // browser API and can leave the UI waiting forever outside its original
  // runtime. GitHub Pages and normal local browser sessions should use
  // localStorage instead.
  const memoryStore = new Map();

  function storageAvailable(){
    try{
      const testKey = '__attendance_storage_test__';
      window.localStorage.setItem(testKey, '1');
      window.localStorage.removeItem(testKey);
      return true;
    }catch(e){
      return false;
    }
  }

  const hasLocalStorage = storageAvailable();

  async function storageGet(key){
    try{
      if(hasLocalStorage) return window.localStorage.getItem(key);
      return memoryStore.has(key) ? memoryStore.get(key) : null;
    }catch(e){
      console.error('storage get failed', e);
      return memoryStore.has(key) ? memoryStore.get(key) : null;
    }
  }

  async function storageSet(key, value){
    try{
      if(hasLocalStorage){
        window.localStorage.setItem(key, value);
      }else{
        memoryStore.set(key, value);
      }
      return true;
    }catch(e){
      console.error('storage set failed', e);
      memoryStore.set(key, value);
      return true;
    }
  }

  async function storageList(prefix){
    try{
      if(hasLocalStorage){
        const keys=[];
        for(let i=0;i<window.localStorage.length;i++){
          const key=window.localStorage.key(i);
          if(key && key.startsWith(prefix)) keys.push(key);
        }
        return keys;
      }
      return Array.from(memoryStore.keys()).filter(k=>k.startsWith(prefix));
    }catch(e){
      return Array.from(memoryStore.keys()).filter(k=>k.startsWith(prefix));
    }
  }

  async function sha256Hex(str){
    const enc = new TextEncoder().encode(str);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }

  function renderDateBlock(){
    const now = new Date();
    el('daynum').textContent = String(now.getDate()).padStart(2,'0');
    el('weekday').textContent = WEEKDAYS[now.getDay()];
    el('monthyear').textContent = `${MONTHS[now.getMonth()]} ${now.getFullYear()}`;
  }
  function tickClock(){
    el('clock').textContent = new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit', second:'2-digit'});
  }

  let toastTm;
  function showToast(msg){
    const t = el('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTm);
    toastTm = setTimeout(()=>t.classList.remove('show'), 2600);
  }

  function renderGrid(){
    el('groupTitle').textContent = groupTitle || 'Attendance';
    document.title = groupTitle || 'Attendance';
    const grid = el('grid');
    const empty = el('emptyState');
    if(!roster.length){
      grid.innerHTML = '';
      empty.hidden = false;
      return;
    }
    empty.hidden = true;
    const sorted = [...roster].sort((a,b)=>a.localeCompare(b));
    grid.innerHTML = sorted.map(name=>{
      const ts = attendanceToday[name];
      const checked = !!ts;
      const animCls = (justChecked===name) ? ' animate' : '';
      return `<button class="tile${checked?' checked':''}" data-name="${escapeHtml(name)}" ${checked?'aria-pressed="true"':''}>
        ${checked ? `<span class="stamp${animCls}"><span class="stamp-text">PRESENT</span><span class="stamp-time">${formatTime(ts)}</span></span>` : ''}
        <span class="name">${escapeHtml(name)}</span>
      </button>`;
    }).join('');
    justChecked = null;
  }

  async function handleTap(name){
    const raw = await storageGet(`attendance:${todayKey}`);
    const latest = raw ? JSON.parse(raw) : {};
    attendanceToday = latest;
    if(latest[name]){
      renderGrid();
      showToast(`Already checked in at ${formatTime(latest[name])}`);
      return;
    }
    const nowIso = new Date().toISOString();
    latest[name] = nowIso;
    const ok = await storageSet(`attendance:${todayKey}`, JSON.stringify(latest));
    if(ok){
      attendanceToday = latest;
      justChecked = name;
      renderGrid();
      showToast('Marked present');
    } else {
      showToast('Could not save — try again');
    }
  }

  async function refreshAttendance(){
    if(manageOpen) return;
    const raw = await storageGet(`attendance:${todayKey}`);
    attendanceToday = raw ? JSON.parse(raw) : {};
    renderGrid();
  }

  function renderRosterList(){
    const list = el('rosterList');
    if(!roster.length){
      list.innerHTML = '<li style="justify-content:center;color:var(--text-muted);">No names added yet</li>';
      return;
    }
    const sorted = [...roster].sort((a,b)=>a.localeCompare(b));
    list.innerHTML = sorted.map(name=>`<li><span>${escapeHtml(name)}</span><button class="remove-btn" data-remove="${escapeHtml(name)}" aria-label="Remove ${escapeHtml(name)}">×</button></li>`).join('');
  }

  async function addName(){
    const input = el('nameInput');
    const name = input.value.trim();
    if(!name) return;
    if(roster.some(n=>n.toLowerCase()===name.toLowerCase())){
      showToast('Already on the list');
      input.value='';
      return;
    }
    roster.push(name);
    input.value='';
    await storageSet('roster', JSON.stringify(roster));
    renderRosterList();
    renderGrid();
  }

  async function removeName(name){
    roster = roster.filter(n=>n!==name);
    await storageSet('roster', JSON.stringify(roster));
    renderRosterList();
    renderGrid();
  }

  async function loadHistoryList(){
    const container = el('historyList');
    container.innerHTML = '<p class="history-empty">Loading…</p>';
    const keys = await storageList('attendance:');
    const dates = keys.map(k=>k.replace('attendance:','')).filter(Boolean).sort().reverse();
    if(!dates.length){
      container.innerHTML = '<p class="history-empty">No check-ins recorded yet.</p>';
      return;
    }
    const records = await Promise.all(dates.map(d=>storageGet(`attendance:${d}`)));
    container.innerHTML = dates.map((d,i)=>{
      const rec = records[i] ? JSON.parse(records[i]) : {};
      const entries = Object.entries(rec).sort((a,b)=> a[1]<b[1]?-1:1);
      const label = formatDateLabel(d);
      const listHtml = entries.length
        ? `<ul class="history-list">${entries.map(([n,t])=>`<li><span>${escapeHtml(n)}</span><span>${formatTime(t)}</span></li>`).join('')}</ul>
           <div class="copy-btn-row"><button class="btn secondary copy-btn" data-date="${d}">Copy list</button></div>`
        : `<p class="history-empty">No one checked in.</p>`;
      return `<details class="history-date" data-date="${d}">
        <summary><span>${label}</span><span class="count">${entries.length} present</span></summary>
        <div class="history-body">${listHtml}</div>
      </details>`;
    }).join('');
    container.querySelectorAll('.copy-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const d = btn.dataset.date;
        const idx = dates.indexOf(d);
        const rec = records[idx] ? JSON.parse(records[idx]) : {};
        const entries = Object.entries(rec).sort((a,b)=> a[1]<b[1]?-1:1);
        const text = `${formatDateLabel(d)}\n` + entries.map(([n,t])=>`${n} — ${formatTime(t)}`).join('\n');
        navigator.clipboard.writeText(text).then(()=>showToast('Copied')).catch(()=>showToast('Could not copy'));
      });
    });
  }

  async function openManage(){
    manageOpen = true;
    el('overlay').hidden = false;
    el('contentSection').hidden = true;
    const hash = await storageGet('admin-pin-hash');
    if(!hash){
      el('pinLockSection').hidden = true;
      el('pinSetupSection').hidden = false;
      el('newPin1').value = '';
      el('newPin2').value = '';
      el('pinSetupError').hidden = true;
      el('newPin1').focus();
    } else {
      el('pinSetupSection').hidden = true;
      el('pinLockSection').hidden = false;
      el('pinInput').value = '';
      el('pinError').hidden = true;
      el('pinInput').focus();
    }
  }
  function unlockContent(){
    el('pinSetupSection').hidden = true;
    el('pinLockSection').hidden = true;
    el('contentSection').hidden = false;
    el('changePinForm').hidden = true;
    el('titleInput').value = groupTitle;
    renderRosterList();
    switchTab('roster');
  }
  function closeManage(){
    manageOpen = false;
    el('overlay').hidden = true;
  }
  function switchTab(tab){
    el('tabRoster').classList.toggle('active', tab==='roster');
    el('tabHistory').classList.toggle('active', tab==='history');
    el('rosterTab').hidden = tab!=='roster';
    el('historyTab').hidden = tab!=='history';
    if(tab==='history') loadHistoryList();
  }

  function bindEvents(){
    el('grid').addEventListener('click', (e)=>{
      const tile = e.target.closest('.tile');
      if(!tile) return;
      handleTap(tile.dataset.name);
    });
    el('manageToggle').addEventListener('click', openManage);
    el('emptyManageBtn').addEventListener('click', openManage);
    el('closeManage').addEventListener('click', closeManage);
    el('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeManage(); });
    document.addEventListener('keydown', (e)=>{ if(e.key==='Escape' && manageOpen) closeManage(); });
    el('tabRoster').addEventListener('click', ()=>switchTab('roster'));
    el('tabHistory').addEventListener('click', ()=>switchTab('history'));
    el('addNameBtn').addEventListener('click', addName);
    el('nameInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') addName(); });
    el('rosterList').addEventListener('click', (e)=>{
      const btn = e.target.closest('[data-remove]');
      if(btn) removeName(btn.dataset.remove);
    });
    el('titleInput').addEventListener('change', async ()=>{
      groupTitle = el('titleInput').value.trim() || 'Attendance';
      await storageSet('group-title', groupTitle);
      renderGrid();
    });

    el('pinSetupBtn').addEventListener('click', async ()=>{
      const p1 = el('newPin1').value.trim();
      const p2 = el('newPin2').value.trim();
      if(p1.length<4 || p1!==p2){
        el('pinSetupError').hidden = false;
        return;
      }
      el('pinSetupError').hidden = true;
      const hash = await sha256Hex(p1);
      await storageSet('admin-pin-hash', hash);
      unlockContent();
    });
    el('newPin2').addEventListener('keydown', (e)=>{ if(e.key==='Enter') el('pinSetupBtn').click(); });

    el('pinSubmit').addEventListener('click', async ()=>{
      const val = el('pinInput').value.trim();
      const hash = await storageGet('admin-pin-hash');
      const enteredHash = await sha256Hex(val);
      if(hash && enteredHash===hash){
        el('pinError').hidden = true;
        unlockContent();
      } else {
        el('pinError').hidden = false;
        el('pinInput').value = '';
        el('pinInput').focus();
      }
    });
    el('pinInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') el('pinSubmit').click(); });

    el('changePinBtn').addEventListener('click', ()=>{
      el('changePinForm').hidden = !el('changePinForm').hidden;
    });
    el('savePinChangeBtn').addEventListener('click', async ()=>{
      const p1 = el('newPinChange').value.trim();
      const p2 = el('newPinChangeConfirm').value.trim();
      if(p1.length<4 || p1!==p2){
        showToast('PIN must be at least 4 digits and match');
        return;
      }
      const hash = await sha256Hex(p1);
      await storageSet('admin-pin-hash', hash);
      el('newPinChange').value = '';
      el('newPinChangeConfirm').value = '';
      el('changePinForm').hidden = true;
      showToast('PIN updated');
    });
  }

  async function init(){
    renderDateBlock();
    tickClock();
    setInterval(tickClock, 1000);
    bindEvents();

    const [rRaw, tRaw, aRaw] = await Promise.all([
      storageGet('roster'),
      storageGet('group-title'),
      storageGet(`attendance:${todayKey}`)
    ]);
    roster = rRaw ? JSON.parse(rRaw) : [];
    groupTitle = tRaw || 'Attendance';
    attendanceToday = aRaw ? JSON.parse(aRaw) : {};
    renderGrid();

    setInterval(refreshAttendance, 6000);
  }

  init();
})();
</script>
</body>
</html>
